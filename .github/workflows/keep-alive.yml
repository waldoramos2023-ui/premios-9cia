# Mantiene "despierto" el proyecto Supabase para que no se pause por inactividad.
#
# CRITERIO REAL (docs/guides/platform/free-project-pausing): el plan free NO exige
# "al menos una consulta cada 7 días", sino UNAS POCAS CONSULTAS DE USUARIO CADA DÍA
# durante la semana previa. El esquema anterior (lunes y jueves, 1 consulta) quedaba
# muy por debajo del umbral: el 22-08-2026 el proyecto se pausó igual, pese a que
# este workflow había corrido con éxito el 13, 17 y 20 de agosto.
#
# Por eso ahora corre 3 veces al día con 3 consultas por ejecución (~9 diarias).
#
# No necesita secretos: la URL y la "publishable key" se leen de js/config.js, que
# ya es pública (RLS controla el acceso real). Si algún día cambia el proyecto, basta
# con actualizar js/config.js y este workflow lo toma automáticamente.
#
# OJO: GitHub deshabilita solo los workflows programados tras 60 días sin commits en
# el repositorio (estado `disabled_inactivity`). Ya pasó una vez. Si el repo queda
# inactivo, reactivarlo con:
#   gh workflow enable keep-alive.yml --repo waldoramos2023-ui/premios-9cia
name: Keep-alive Supabase

on:
  schedule:
    # Tres veces al día. Minuto no-cero a propósito: GitHub recomienda evitar el
    # tope de hora por congestión de los runners.
    - cron: '23 5 * * *'
    - cron: '23 13 * * *'
    - cron: '23 20 * * *'
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Consultar Supabase (mantener activo)
        run: |
          set -euo pipefail

          # Extraer URL y llave publicable desde js/config.js (contenido entre comillas).
          URL=$(grep SUPABASE_URL js/config.js | sed "s/.*'\(.*\)'.*/\1/")
          KEY=$(grep SUPABASE_KEY js/config.js | sed "s/.*'\(.*\)'.*/\1/")

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No se pudo leer SUPABASE_URL/KEY desde js/config.js"
            exit 1
          fi

          echo "Proyecto: $URL"

          # Tres consultas de solo lectura: tocan Postgres a través de PostgREST, que
          # es lo que Supabase contabiliza como actividad de usuario.
          consultar() {
            curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/$1"
          }

          FALLAS=0
          for query in \
            'voluntarios?select=numero&limit=1' \
            'voluntarios?select=numero,nombre&order=numero&limit=5' \
            'voluntarios?select=numero&activo=eq.true&limit=3'
          do
            CODE=$(consultar "$query")
            echo "HTTP $CODE  ←  $query"
            if [ "$CODE" != "200" ]; then
              echo "::warning::Consulta sin 200 (HTTP $CODE): $query"
              FALLAS=$((FALLAS + 1))
            fi
            sleep 2
          done

          if [ "$FALLAS" -gt 0 ]; then
            echo "::error::$FALLAS de 3 consultas fallaron. ¿Proyecto pausado o llave inválida?"
            echo "Última respuesta: $(cat /tmp/resp.txt)"
            exit 1
          fi

          echo "✓ Supabase activo (3/3 consultas)."
